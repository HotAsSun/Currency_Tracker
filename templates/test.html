<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Candlestick Chart</title>
  <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    #chart {
      width: 100%;
      height: 500px;
    }
  </style>
</head>
<body>
  <div id="chart"></div>

  <script>
    const chart = LightweightCharts.createChart(document.getElementById('chart'), {
      layout: { background: { color: '#131722' }, textColor: '#D9D9D9' },
      grid: { vertLines: { color: '#1E222D' }, horzLines: { color: '#1E222D' } },
      timeScale: { borderColor: '#485c7b' },
    });

    const candleSeries = chart.addCandlestickSeries();

    // Example dummy data
    candleSeries.setData([
      { time: '2025-10-08T10:00:00', open: 1179800000, high: 1188100000, low: 1174800000, close: 1187800000 },
      { time: '2025-10-08T11:00:00', open: 1187800000, high: 1188100000, low: 1174800000, close: 1179800000 },
      { time: '2025-10-08T12:00:00', open: 1179800000, high: 1187800000, low: 1174800000, close: 1180000000 },
    ]);

    // Example fetch from Flask API:
    // fetch("/api/currency/dollar/ohlc")
    //   .then(res => res.json())
    //   .then(data => candleSeries.setData(data));
  </script>
</body>
</html>
